name: Prune artifacts

# Safety net for the shared Free-plan artifact quota: artifacts uploaded by this
# repository are deleted after one day even if a workflow forgot retention-days.
# This only touches pstoandroid; other repositories must run the same snippet
# (or `gh api -X DELETE`) with their own token.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than 1 day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.created_at)"' |
          while read -r id created; do
            if [[ "$created" < "$cutoff" ]]; then
              echo "deleting artifact $id ($created)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
            fi
          done
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length' |
          tail -1 | sed 's/^/remaining artifacts: /'
